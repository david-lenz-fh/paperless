HTML
<div class="app-container">
  <header class="app-header">
    <h1>Paperless DMS</h1>
    <button class="btn-primary" (click)="toggleUploadForm()">
      {{ showUploadForm() ? '✕ Schließen' : '+ Neues Dokument hochladen' }}
    </button>
  </header>

  @if (showUploadForm()) {
    <section class="upload-wrapper">
      <app-document-upload 
        [documentToEdit]="selectedDocument()" 
        (uploadSuccess)="onUploadFinished()">
      </app-document-upload>
    </section>
  }

  <main class="list-wrapper">
    <app-document-list (editDocument)="onEditDocument($event)"></app-document-list>
  </main>
</div>
